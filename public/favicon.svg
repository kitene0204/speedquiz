<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <!-- Background Gradient: Vibrant Amber to Orange -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#F97316" />
    </linearGradient>
    <!-- Shadow Filter for high contrast in browser tab -->
    <filter id="tabShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#78350F" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Squircle Base Card -->
  <rect x="6" y="6" width="88" height="88" rx="24" fill="url(#bgGrad)" stroke="#FFFFFF" stroke-width="4" filter="url(#tabShadow)" />

  <!-- Speed Quiz Lightning Bolt + Sparkle / Question Accent -->
  <!-- Lightning Bolt (White with strong navy accent) -->
  <path d="M54 18 L28 50 L48 50 L42 82 L72 44 L52 44 Z" fill="#FFFFFF" stroke="#0369A1" stroke-width="3" stroke-linejoin="round" />

  <!-- Playful mini sparkle at top right -->
  <circle cx="74" cy="24" r="5" fill="#FEF08A" stroke="#0369A1" stroke-width="2" />
  <circle cx="26" cy="72" r="3.5" fill="#FEF08A" stroke="#0369A1" stroke-width="1.5" />
</svg>
